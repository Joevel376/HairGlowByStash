{% extends "base.html" %}

{% block content %}

<div class="min-h-screen flex items-center justify-center bg-gradient-to-br from-gray-50 to-gray-100 px-4">
  <div class="w-full max-w-md bg-white rounded-2xl shadow-xl p-8">

    <h1 class="text-2xl font-bold text-gray-900 mb-6 text-center">
      Admin Login
    </h1>

    <form id="loginForm" class="space-y-5">
      
      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Email
        </label>
        <input
          type="email"
          name="email"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none"
        >
      </div>

      <div>
        <label class="block text-sm font-medium text-gray-700 mb-1">
          Password
        </label>
        <input
          type="password"
          name="password"
          required
          class="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-pink-500 focus:border-transparent outline-none"
        >
      </div>

      <button
        type="submit"
        class="w-full bg-gradient-to-r from-pink-500 to-pink-600 hover:from-pink-600 hover:to-pink-700 text-white font-semibold py-3 rounded-lg shadow-md transition-all"
      >
        Login
      </button>

      <p id="errorMessage" class="text-red-500 text-sm text-center hidden">
        Invalid credentials
      </p>

    </form>

  </div>
</div>

<script>
document.getElementById("loginForm").addEventListener("submit", async function(e) {
  e.preventDefault();

  const formData = new FormData(this);

  const response = await fetch("/admin/login", {
    method: "POST",
    body: formData
  });

  if (response.ok) {
    window.location.href = "/admin/dashboard";
  } else {
    document.getElementById("errorMessage").classList.remove("hidden");
  }
});
</script>

{% endblock %}
